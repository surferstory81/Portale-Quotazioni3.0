apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 102400
    scrape_configs:
      # ── portale-quotazioni: backend, frontend, postgres ──────────────
      - job_name: portale-quotazioni
        static_configs:
          - targets:
              - localhost
            labels:
              namespace: portale-quotazioni
              __path__: /var/log/pods/portale-quotazioni_*/*/*.log
        pipeline_stages:
          # Parse CRI log format: timestamp stream flags message
          - cri: {}
          # Extract pod, container and app label from the file path
          # Path format: /var/log/pods/<namespace>_<pod-name>_<uid>/<container>/<num>.log
          - regex:
              source: filename
              expression: '/var/log/pods/[^/]+/(?P<container>[^/]+)/\d+\.log'
          - regex:
              source: filename
              expression: '/var/log/pods/[^_]+_(?P<pod>[^_]+)_[^/]+/'
          - labels:
              container:
              pod:
          # Derive app label from pod name prefix (e.g. backend-xxx → backend)
          - regex:
              source: pod
              expression: '^(?P<app>[a-z]+)-'
          - labels:
              app:
