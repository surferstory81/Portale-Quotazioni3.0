apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portale-quotazioni-2-be
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: portale-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portale-quotazioni-2-be
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
