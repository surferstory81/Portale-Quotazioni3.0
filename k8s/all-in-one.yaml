apiVersion: v1
kind: Namespace
metadata:
  name: portale-quotazioni
---
apiVersion: v1
kind: Secret
metadata:
  name: portale-secrets
  namespace: portale-quotazioni
type: Opaque
data:
  # echo -n 'portale_user' | base64
  DB_USER: cG9ydGFsZV91c2Vy
  # echo -n 'CHANGE_ME_DB_PASSWORD' | base64
  DB_PASSWORD: Q0hBTkdFX01FX0RCX1BBU1NXT1JE
  # echo -n 'portaledb' | base64
  DB_NAME: cG9ydGFsZWRi
  # echo -n 'change-me-to-a-strong-secret-at-least-32-chars' | base64
  JWT_SECRET: Y2hhbmdlLW1lLXRvLWEtc3Ryb25nLXNlY3JldC1hdC1sZWFzdC0zMi1jaGFycw==
  # echo -n 'Admin@2024!' | base64
  ADMIN_DEFAULT_PASSWORD: QWRtaW5AMjAyNCE=
  # echo -n 'mylv bult dioj ibro' | base64
  SMTP_PASS: bXlsdiBidWx0IGRpb2ogaWJybw==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: portale-quotazioni
data:
  NODE_ENV: "production"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  APP_PORT: "3000"
  APP_BASE_URL: "http://portale-quotazioni.local"
  FRONTEND_URL: "http://portale-quotazioni.local"
  EMAIL_ENABLED: "true"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "daniele.celauro@gmail.com"
  SMTP_FROM: "Portale Quotazioni <no-reply@credit-agricole.it>"
  EMAIL_ADMIN_RECIPIENTS: "admin@credit-agricole.it"
  # SMTP_PASS è ora nel Secret
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
  ADMIN_MATRICOLA: "ADMIN001"
  ADMIN_EMAIL: "admin@quotazioni.local"
  SSO_ENABLED: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: portale-quotazioni
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: portale-quotazioni
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_NAME
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portale-quotazioni
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/surferstory81/portale-quotazioni-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: JWT_SECRET
            - name: ADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: ADMIN_DEFAULT_PASSWORD
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: portale-secrets
                  key: SMTP_PASS
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: portale-quotazioni
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/surferstory81/portale-quotazioni-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://backend:3000"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: portale-quotazioni
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portale-quotazioni
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: portale-quotazioni
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portale-ingress
  namespace: portale-quotazioni
spec:
  ingressClassName: nginx
  rules:
    - host: portale-quotazioni.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
