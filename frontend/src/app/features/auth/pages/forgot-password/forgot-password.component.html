<section class="auth-page">
  <div class="auth-card">
    <h2>Password dimenticata</h2>
    <p>Inserisci la tua email per ricevere le istruzioni di reimpostazione.</p>

    <div *ngIf="successMessage" class="message success">{{ successMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <label>Email
        <input type="email" placeholder="nome@azienda.it" formControlName="email" />
        <small class="error" *ngIf="hasError('email')">Inserisci una email valida.</small>
      </label>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Invio in corso...' : 'Invia istruzioni' }}
      </button>
    </form>

    <a routerLink="/auth/login">← Torna al login</a>
  </div>
</section>
