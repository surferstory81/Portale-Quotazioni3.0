<section class="auth-page">
  <div class="auth-card">
    <h2>Reimposta password</h2>

    <div *ngIf="tokenMissing" class="message error">
      Link non valido. Torna alla pagina di <a routerLink="/auth/forgot-password">recupero password</a>.
    </div>

    <div *ngIf="successMessage" class="message success">
      {{ successMessage }}<br>
      <small>Reindirizzamento al login in corso...</small>
    </div>

    <p *ngIf="!tokenMissing && !successMessage">Scegli una nuova password per il tuo account.</p>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      *ngIf="!tokenMissing && !successMessage"
    >
      <label>Nuova password
        <input type="password" placeholder="Min 8 caratteri" formControlName="newPassword" />
        <small class="error" *ngIf="hasError('newPassword')">
          Min 8 caratteri con maiuscola, minuscola, numero e simbolo.
        </small>
      </label>

      <label>Conferma password
        <input type="password" placeholder="Ripeti la password" formControlName="confirmPassword" />
        <small class="error" *ngIf="hasError('confirmPassword') && !mismatch">
          Campo obbligatorio.
        </small>
        <small class="error" *ngIf="mismatch">Le password non corrispondono.</small>
      </label>

      <p *ngIf="errorMessage" class="error global">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Salvataggio...' : 'Salva nuova password' }}
      </button>
    </form>

    <a routerLink="/auth/login">← Torna al login</a>
  </div>
</section>
