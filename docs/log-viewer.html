<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer - Portale Quotazioni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
        }
        h1 {
            color: #4fc3f7;
            margin-bottom: 10px;
        }
        .service-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .service-btn {
            padding: 10px 20px;
            border: 2px solid #4fc3f7;
            background: transparent;
            color: #4fc3f7;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .service-btn:hover {
            background: #4fc3f7;
            color: #1a1a1a;
        }
        .service-btn.active {
            background: #4fc3f7;
            color: #1a1a1a;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, input {
            padding: 8px 12px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            border: none;
            background: #4fc3f7;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #6dd5fa;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .log-container {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
        }
        .log-entry {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.info {
            border-left: 3px solid #4fc3f7;
        }
        .log-entry.warn {
            border-left: 3px solid #ffa726;
        }
        .log-entry.error {
            border-left: 3px solid #ef5350;
            background: rgba(239, 83, 80, 0.1);
        }
        .log-timestamp {
            color: #888;
            margin-right: 10px;
        }
        .log-level {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 10px;
        }
        .log-level.info {
            background: #4fc3f7;
            color: #1a1a1a;
        }
        .log-level.warn {
            background: #ffa726;
            color: #1a1a1a;
        }
        .log-level.error {
            background: #ef5350;
            color: #fff;
        }
        .log-context {
            color: #9c27b0;
            margin-right: 10px;
        }
        .log-message {
            color: #e0e0e0;
        }
        .log-stack {
            color: #ef5350;
            white-space: pre-wrap;
            margin-top: 8px;
            padding-left: 20px;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 150px;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #4fc3f7;
            font-size: 24px;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error-message {
            background: rgba(239, 83, 80, 0.2);
            border: 1px solid #ef5350;
            color: #ef5350;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Log Viewer</h1>
            <p>Real-time log visualization for Portale Quotazioni services</p>
        </header>

        <div class="service-selector">
            <button class="service-btn active" data-service="ai" data-port="3001">AI Estimation Service</button>
            <button class="service-btn" data-service="backend" data-port="3000">Backend Service</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="fileSelect">Log File:</label>
                <select id="fileSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            <div class="control-group">
                <label for="linesInput">Lines:</label>
                <input type="number" id="linesInput" value="50" min="10" max="500" step="10">
            </div>
            <div class="control-group">
                <button id="refreshBtn">🔄 Refresh</button>
                <button id="clearBtn">🗑️ Clear</button>
            </div>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefreshCheck">
                <label for="autoRefreshCheck">Auto-refresh (10s)</label>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="stats" id="statsContainer" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Total Logs</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Info</div>
                <div class="stat-value" id="statInfo" style="color: #4fc3f7;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Warnings</div>
                <div class="stat-value" id="statWarn" style="color: #ffa726;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Errors</div>
                <div class="stat-value" id="statError" style="color: #ef5350;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">File Size</div>
                <div class="stat-value" id="statSize">0 KB</div>
            </div>
        </div>

        <div class="log-container" id="logContainer">
            <div class="loading">Loading logs...</div>
        </div>
    </div>

    <script>
        let currentService = 'ai';
        let currentPort = 3001;
        let autoRefreshInterval = null;

        // Service selector
        document.querySelectorAll('.service-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentService = btn.dataset.service;
                currentPort = btn.dataset.port;
                loadFiles();
            });
        });

        // Load available log files
        async function loadFiles() {
            try {
                const response = await fetch(`http://localhost:${currentPort}/api/logs/files`);
                const data = await response.json();

                const select = document.getElementById('fileSelect');
                select.innerHTML = '';

                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file.filename;
                        option.textContent = file.filename;
                        select.appendChild(option);
                    });
                    loadLogs();
                } else {
                    select.innerHTML = '<option value="">No log files found</option>';
                }
            } catch (error) {
                showError('Failed to load log files: ' + error.message);
            }
        }

        // Load logs
        async function loadLogs() {
            const filename = document.getElementById('fileSelect').value;
            const lines = document.getElementById('linesInput').value;

            if (!filename) return;

            try {
                document.getElementById('errorContainer').innerHTML = '';
                document.getElementById('logContainer').innerHTML = '<div class="loading">Loading logs...</div>';

                const response = await fetch(`http://localhost:${currentPort}/api/logs/view/${filename}?lines=${lines}`);
                const data = await response.json();

                displayLogs(data.logs);
                await loadStats(filename);
            } catch (error) {
                showError('Failed to load logs: ' + error.message);
            }
        }

        // Load stats
        async function loadStats(filename) {
            try {
                const response = await fetch(`http://localhost:${currentPort}/api/logs/stats/${filename}`);
                const data = await response.json();

                document.getElementById('statTotal').textContent = data.totalLines;
                document.getElementById('statInfo').textContent = data.byLevel.info || 0;
                document.getElementById('statWarn').textContent = data.byLevel.warn || 0;
                document.getElementById('statError').textContent = data.byLevel.error || 0;
                document.getElementById('statSize').textContent = (data.fileSize / 1024).toFixed(2) + ' KB';
                document.getElementById('statsContainer').style.display = 'flex';
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Display logs
        function displayLogs(logs) {
            const container = document.getElementById('logContainer');

            if (logs.length === 0) {
                container.innerHTML = '<div class="loading">No logs found</div>';
                return;
            }

            container.innerHTML = '';

            logs.forEach(log => {
                const entry = document.createElement('div');
                entry.className = `log-entry ${log.level || 'info'}`;

                let html = '';

                if (log.timestamp) {
                    html += `<span class="log-timestamp">${log.timestamp}</span>`;
                }

                if (log.level) {
                    html += `<span class="log-level ${log.level}">${log.level.toUpperCase()}</span>`;
                }

                if (log.context) {
                    html += `<span class="log-context">[${log.context}]</span>`;
                }

                html += `<span class="log-message">${log.message}</span>`;

                if (log.stack) {
                    html += `<div class="log-stack">${log.stack}</div>`;
                }

                entry.innerHTML = html;
                container.appendChild(entry);
            });
        }

        // Show error
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            document.getElementById('logContainer').innerHTML = '<div class="loading">Unable to load logs</div>';
        }

        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', loadLogs);
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('logContainer').innerHTML = '<div class="loading">Logs cleared. Click refresh to reload.</div>';
        });
        document.getElementById('fileSelect').addEventListener('change', loadLogs);
        document.getElementById('linesInput').addEventListener('change', loadLogs);

        // Auto-refresh
        document.getElementById('autoRefreshCheck').addEventListener('change', (e) => {
            if (e.target.checked) {
                autoRefreshInterval = setInterval(loadLogs, 10000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        });

        // Initial load
        loadFiles();
    </script>
</body>
</html>
